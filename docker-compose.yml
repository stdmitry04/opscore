version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: opscore
      POSTGRES_USER: opscore
      POSTGRES_PASSWORD: opscore
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opscore"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=opscore.settings.dev
      - DB_HOST=postgres
      - DB_NAME=opscore
      - DB_USER=opscore
      - DB_PASSWORD=opscore
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-change-me}
      - CORS_ORIGINS=http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
    working_dir: /app

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A opscore worker -l info -Q default,embeddings,processing,emails,reports -c 4
    environment:
      - DJANGO_SETTINGS_MODULE=opscore.settings.dev
      - DB_HOST=postgres
      - DB_NAME=opscore
      - DB_USER=opscore
      - DB_PASSWORD=opscore
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app
    working_dir: /app

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A opscore beat -l info
    environment:
      - DJANGO_SETTINGS_MODULE=opscore.settings.dev
      - DB_HOST=postgres
      - DB_NAME=opscore
      - DB_USER=opscore
      - DB_PASSWORD=opscore
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app
    working_dir: /app

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
